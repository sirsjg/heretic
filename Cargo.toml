[workspace]
resolver = "2"
members = ["crates/heretic-core", "crates/heretic-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sirsjg/accelerate"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
async-trait = "0.1"
