name: Audit

# Advisories land against dependencies long after they are merged, so this runs
# on a schedule rather than on every pull request — a new advisory is news, not
# a reason to block someone's unrelated change.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - ".github/workflows/audit.yml"

permissions:
  contents: read

jobs:
  cargo:
    name: Cargo advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Prebuilt, rather than spending five minutes compiling cargo-audit.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Only an actual vulnerability fails this. Informational warnings are
      # printed but tolerated: Tauri reaches Linux through the GTK3 bindings,
      # which upstream has archived in favour of gtk4-rs, so the whole gtk/gdk/
      # atk tree reports as unmaintained. That is Tauri's dependency to move,
      # not ours, and failing on it would mean a permanently red audit that
      # nobody reads — which is worse than no audit at all.
      - name: Audit
        run: |
          set -uo pipefail
          cargo audit --json --file Cargo.lock > audit.json || true

          echo "Informational warnings:"
          jq -r '.warnings | to_entries[] | .value[]
                 | "  \(.advisory.id)  \(.package.name) \(.package.version)  (\(.kind))"' \
            audit.json | sort || true

          count=$(jq '.vulnerabilities.count' audit.json)
          echo
          echo "Vulnerabilities: $count"
          if [ "$count" -ne 0 ]; then
            jq -r '.vulnerabilities.list[]
                   | "  \(.advisory.id)  \(.package.name) \(.package.version)\n    \(.advisory.title)"' \
              audit.json
            exit 1
          fi

  npm:
    name: npm advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --audit-level high
