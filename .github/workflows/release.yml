name: Release

# semantic-release reads the conventional commits since the last tag, decides
# the next version, writes it into every manifest, tags it and opens the GitHub
# release. build.yml then attaches the desktop bundles to that release.
#
# The tag is pushed with GITHUB_TOKEN, which deliberately does not trigger other
# workflows — so the build is called directly from here rather than waiting on a
# tag-push event that will never arrive.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.published }}
      tag: ${{ steps.semantic.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release@25 \
            @semantic-release/changelog@7 \
            @semantic-release/exec@7 \
            @semantic-release/git@11 \
            conventional-changelog-conventionalcommits@8

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          before=$(git describe --tags --abbrev=0 2>/dev/null || echo none)

          npx semantic-release

          git fetch --tags --force
          after=$(git describe --tags --abbrev=0 2>/dev/null || echo none)

          if [ "$after" != "$before" ] && [ "$after" != none ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "tag=$after" >> "$GITHUB_OUTPUT"
            echo "Released $after"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to release"
          fi

  build:
    name: Build
    needs: version
    if: needs.version.outputs.published == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
