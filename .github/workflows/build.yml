name: Build release

# Builds the desktop bundles for a tag and attaches them to its GitHub release.
#
# Called by release.yml once semantic-release has cut a version, and available
# on its own for rebuilding a tag by hand:
#
#   gh workflow run build.yml -f tag=v0.1.0
#
# There is deliberately no tag trigger. The tag is pushed with a personal access
# token, which does start workflows, so a `push: tags:` trigger would race a
# second set of bundles against the ones release.yml is already building — both
# uploading to the same release.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build, e.g. v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: ${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            slug: darwin_arm64
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            slug: darwin_amd64
            bundles: app,dmg
          # Built on the oldest supported image so the glibc the binary links
          # against is old enough for the distributions people actually run.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            slug: linux_amd64
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            build-essential \
            file \
            wget

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build bundles
        shell: bash
        env:
          # Ad-hoc signature. Heretic is not distributed under an Apple
          # Developer ID, so this is about producing a valid signature for the
          # bundle, not about passing notarisation.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          # Signs the bundles the in-app updater installs; the app checks them
          # against the public key in tauri.conf.json. Without the secret the
          # release still builds, it just ships no update for existing installs.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          updater=
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            updater='{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; building without updater bundles"
          fi
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} \
            ${updater:+--config "$updater"}

      - name: Collect artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SLUG: ${{ matrix.slug }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          bundle="target/$TARGET/release/bundle"

          collect() {
            # $1 = subdirectory, $2 = extension
            found=$(find "$bundle/$1" -maxdepth 1 -name "*.$2" -type f | head -n 1)
            if [ -z "$found" ]; then
              echo "no .$2 produced in $bundle/$1" >&2
              exit 1
            fi
            cp "$found" "dist/heretic_${VERSION}_${SLUG}.$2"
            echo "  heretic_${VERSION}_${SLUG}.$2  <-  $found"
          }

          # The updater's bundles and their signatures, present only when the
          # build was signed. A missing one is skipped here and caught by
          # updater-manifest.sh, which wants all or none.
          collect_signed() {
            # $1 = subdirectory, $2 = extension
            found=$(find "$bundle/$1" -maxdepth 1 -name "*.$2.sig" -type f | head -n 1)
            [ -n "$found" ] || return 0
            cp "${found%.sig}" "dist/heretic_${VERSION}_${SLUG}.$2"
            cp "$found" "dist/heretic_${VERSION}_${SLUG}.$2.sig"
            echo "  heretic_${VERSION}_${SLUG}.$2.sig  <-  $found"
          }

          echo "collected:"
          case "$SLUG" in
            darwin_*)
              collect dmg dmg
              collect_signed macos app.tar.gz
              ;;
            linux_*)
              collect appimage AppImage
              collect deb deb
              collect_signed appimage AppImage
              collect_signed deb deb
              ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: staging
          pattern: bundles-*
          merge-multiple: true

      - name: Updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Release notes shown in the app. A hand-pushed tag has no release yet.
          NOTES=$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)
          export NOTES
          status=0
          scripts/updater-manifest.sh "${TAG#v}" staging "${{ github.repository }}" \
            > latest.json || status=$?
          case "$status" in
            0) mv latest.json staging/latest.json; cat staging/latest.json ;;
            3) echo "::warning::unsigned build; existing installs will not be offered this release" ;;
            *) exit "$status" ;;
          esac

      - name: Checksum
        working-directory: staging
        run: |
          set -euo pipefail
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # release.yml gets here with the release already created by
          # semantic-release; a hand-pushed tag will not have one yet.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" staging/* --clobber

  homebrew:
    name: Homebrew cask
    needs: publish
    runs-on: ubuntu-latest
    # The tap lives in another repository, so this needs a token that can push
    # there. Without the secret the release still succeeds without a cask.
    if: vars.HOMEBREW_TAP != ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Update the cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: ${{ vars.HOMEBREW_TAP }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern checksums.txt --dir .

          sha_for() { awk -v f="$1" '$2 == f { print $1; exit }' checksums.txt; }
          arm_sha=$(sha_for "heretic_${version}_darwin_arm64.dmg")
          intel_sha=$(sha_for "heretic_${version}_darwin_amd64.dmg")
          [ -n "$arm_sha" ] && [ -n "$intel_sha" ] || { echo "missing macOS checksums" >&2; exit 1; }

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP}.git" tap
          mkdir -p tap/Casks
          cat > tap/Casks/heretic.rb <<CASK
          cask "heretic" do
            arch arm: "arm64", intel: "amd64"

            version "${version}"
            sha256 arm:   "${arm_sha}",
                   intel: "${intel_sha}"

            url "https://github.com/${{ github.repository }}/releases/download/v#{version}/heretic_#{version}_darwin_#{arch}.dmg",
                verified: "github.com/${{ github.repository }}/"
            name "Heretic"
            desc "Desktop companion that runs Flux boards with a team of AI agents"
            homepage "https://github.com/${{ github.repository }}"

            depends_on macos: ">= :monterey"

            # The app updates itself in place, so brew upgrade leaves it alone.
            auto_updates true

            app "Heretic.app"

            zap trash: [
              "~/Library/Application Support/Heretic",
              "~/Library/Caches/dev.sirsjg.heretic",
              "~/Library/Preferences/dev.sirsjg.heretic.plist",
              "~/Library/Saved Application State/dev.sirsjg.heretic.savedState",
            ]
          end
          CASK

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/heretic.rb
          if git diff --cached --quiet; then
            echo "cask already current"
          else
            git commit -m "heretic ${version}"
            git push
          fi
